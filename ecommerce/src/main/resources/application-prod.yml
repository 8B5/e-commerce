# 운영 환경 설정 (K8s 환경 변수 주입)
spring:
  # 데이터소스 설정 (K8s 환경 변수)
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:10}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${DB_IDLE_TIMEOUT:600000}
      max-lifetime: ${DB_MAX_LIFETIME:1800000}
      leak-detection-threshold: ${DB_LEAK_DETECTION_THRESHOLD:60000}

  # JPA 설정 (운영 환경)
  jpa:
    hibernate:
      ddl-auto: validate  # 운영에서는 스키마 검증만
    show-sql: false       # 운영에서는 SQL 로그 비활성화
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: ${DB_SCHEMA:public}

  # Redis 설정 (운영 환경)
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: ${REDIS_TIMEOUT:5000ms}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:20}
          max-idle: ${REDIS_POOL_MAX_IDLE:20}
          min-idle: ${REDIS_POOL_MIN_IDLE:5}

# 서버 설정 (운영 환경)
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/api}
  tomcat:
    threads:
      max: ${SERVER_TOMCAT_MAX_THREADS:200}
      min-spare: ${SERVER_TOMCAT_MIN_SPARE_THREADS:10}
    max-connections: ${SERVER_TOMCAT_MAX_CONNECTIONS:8192}
    accept-count: ${SERVER_TOMCAT_ACCEPT_COUNT:100}

# 로깅 설정 (운영 환경)
logging:
  level:
    com.ecommerce: ${LOG_LEVEL_APP:INFO}
    org.springframework.security: ${LOG_LEVEL_SECURITY:WARN}
    org.hibernate: ${LOG_LEVEL_HIBERNATE:WARN}
    org.springframework.web: ${LOG_LEVEL_WEB:WARN}
  file:
    name: ${LOG_FILE_PATH:/app/logs/ecommerce.log}
  logback:
    rollingpolicy:
      max-file-size: ${LOG_MAX_FILE_SIZE:100MB}
      max-history: ${LOG_MAX_HISTORY:30}

# 애플리케이션 설정 (운영)
app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry: ${JWT_ACCESS_TOKEN_EXPIRY:3600}
    refresh-token-expiry: ${JWT_REFRESH_TOKEN_EXPIRY:604800}
  
  crypto:
    secret-key: ${CRYPTO_SECRET_KEY}

# 액추에이터 (운영 환경에서는 제한적 노출)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: ${ACTUATOR_BASE_PATH:/actuator}
  endpoint:
    health:
      show-details: never
  metrics:
    export:
      prometheus:
        enabled: ${PROMETHEUS_ENABLED:true}

# 보안 설정
security:
  require-ssl: ${SECURITY_REQUIRE_SSL:true}
  
# 캐시 설정
spring:
  cache:
    type: ${CACHE_TYPE:redis}
    redis:
      time-to-live: ${CACHE_TTL:3600000}  # 1시간