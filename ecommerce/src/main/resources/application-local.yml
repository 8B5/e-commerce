# 로컬 개발 환경 설정
spring:
  # 데이터소스 설정 (로컬 Docker PostgreSQL)
  datasource:
    url: jdbc:postgresql://localhost:5432/ecommerce_local
    username: ecommerce_user
    password: ecommerce_password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      leak-detection-threshold: 60000

  # JPA 설정 (개발 환경)
  jpa:
    hibernate:
      ddl-auto: update  # 개발 환경에서는 스키마 자동 업데이트
    show-sql: true      # SQL 로그 출력
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public

  # Redis 설정 (로컬 개발용)
  data:
    redis:
      host: localhost
      port: 6379
      password: 
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

# 로깅 설정 (개발 환경)
logging:
  level:
    com.ecommerce: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  file:
    name: logs/ecommerce-local.log

# 애플리케이션 설정 (로컬)
app:
  jwt:
    secret: local-jwt-secret-key-for-development-only-not-for-production
    access-token-expiry: 7200      # 2시간 (개발 편의성)
    refresh-token-expiry: 1209600  # 14일
  
  crypto:
    secret-key: bG9jYWwtZGV2ZWxvcG1lbnQtc2VjcmV0LWtleS1mb3ItdGVzdGluZw==  # Base64 encoded

# 개발 도구 설정
spring:
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

# H2 콘솔 (필요시 활성화)
# spring:
#   h2:
#     console:
#       enabled: true
#       path: /h2-console

# 액추에이터 (개발 환경에서는 모든 엔드포인트 노출)
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always