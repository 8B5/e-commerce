def extractEnvironmentVariables() {
    def envVars = []
    def propertiesFile = file('src/main/resources/application.properties')
    
    if (propertiesFile.exists()) {
        propertiesFile.eachLine { line ->
            if (line.contains('${') && line.contains('}')) {
                def matcher = line =~ /\$\{([^}]+)\}/
                matcher.each { match ->
                    def varName = match[1]
                    if (!envVars.contains(varName)) {
                        envVars.add(varName)
                    }
                }
            }
        }
    }
    
    // Java 파일에서 @Value 어노테이션 스캔
    fileTree('src/main/java').matching {
        include '**/*.java'
    }.each { file ->
        file.eachLine { line ->
            if (line.contains('@Value(') && line.contains('${')) {
                def matcher = line =~ /\$\{([^}:]+)/
                matcher.each { match ->
                    def varName = match[1]
                    if (!envVars.contains(varName)) {
                        envVars.add(varName)
                    }
                }
            }
        }
    }
    
    return envVars
}

def updateReadmeFile(String projectStructure, List<String> envVariables) {
    def readmeFile = file('README.md')
    
    if (!readmeFile.exists()) {
        println "README.md 파일이 존재하지 않습니다. 새로 생성합니다."
        return
    }
    
    def content = readmeFile.text
    
    // 프로젝트 구조 업데이트
    content = content.replaceAll(
        /(?s)## 🏗 프로젝트 구조.*?```.*?```/,
        "## 🏗 프로젝트 구조\n\n${projectStructure}"
    )
    
    // 환경 변수 섹션 업데이트
    if (!envVariables.isEmpty()) {
        def envSection = generateEnvironmentVariablesSection(envVariables)
        content = content.replaceAll(
            /(?s)### 필수 환경 변수.*?```properties.*?```/,
            "### 필수 환경 변수\n\n```properties\n${envSection}```"
        )
    }
    
    // 업데이트 시간 추가
    def timestamp = new Date().format('yyyy-MM-dd HH:mm:ss')
    content = content.replaceAll(
        /\*\*Note\*\*: 프로젝트 구조가 변경되거나.*$/,
        "**Note**: 프로젝트 구조가 변경되거나 새로운 환경 변수가 생기면 이 README.md 파일을 자동으로 업데이트합니다.\n\n*Last updated: ${timestamp}*"
    )
    
    readmeFile.text = content
}

def generateEnvironmentVariablesSection(List<String> envVariables) {
    def section = new StringBuilder()
    
    envVariables.each { varName ->
        def description = getEnvironmentVariableDescription(varName)
        section.append("${varName}=                # ${description}\n")
    }
    
    return section.toString()
}

