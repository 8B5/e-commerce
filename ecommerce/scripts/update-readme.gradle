/**
 * README.md 자동 업데이트 스크립트
 * 프로젝트 구조 변경 시 자동으로 README.md를 업데이트합니다.
 */

task updateReadme {
    description = 'README.md 파일을 자동으로 업데이트합니다'
    group = 'documentation'
    
    doLast {
        def projectStructure = generateProjectStructure()
        def envVariables = extractEnvironmentVariables()
        
        updateReadmeFile(projectStructure, envVariables)
        
        println "README.md 파일이 업데이트되었습니다."
    }
}

def generateProjectStructure() {
    def structure = new StringBuilder()
    def srcDir = file('src/main/java/com/ecommerce')
    
    structure.append("```\n")
    structure.append("src/main/java/com/ecommerce/\n")
    
    if (srcDir.exists()) {
        appendDirectoryStructure(srcDir, structure, "")
    }
    
    structure.append("```\n")
    return structure.toString()
}

def appendDirectoryStructure(File dir, StringBuilder structure, String indent) {
    def files = dir.listFiles()?.sort { it.name }
    
    files?.each { file ->
        if (file.isDirectory()) {
            structure.append("${indent}├── ${file.name}/\n")
            
            // 주요 디렉토리에 대한 설명 추가
            def description = getDirectoryDescription(file.name)
            if (description) {
                structure.append("${indent}│   # ${description}\n")
            }
            
            appendDirectoryStructure(file, structure, "${indent}│   ")
        } else if (file.name.endsWith('.java')) {
            structure.append("${indent}├── ${file.name}")
            
            // 주요 클래스에 대한 설명 추가
            def classDescription = getClassDescription(file.name)
            if (classDescription) {
                structure.append("    # ${classDescription}")
            }
            structure.append("\n")
        }
    }
}

