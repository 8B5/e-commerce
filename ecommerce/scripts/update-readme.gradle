    def descriptions = [
        'app.crypto.secret-key': 'AES-256 암호화 키 (Base64 인코딩)',
        'app.jwt.secret': 'JWT 서명 키',
        'app.jwt.access-token-expiry': '액세스 토큰 만료 시간 (초)',
        'app.jwt.refresh-token-expiry': '리프레시 토큰 만료 시간 (초)',
        'spring.datasource.url': '데이터베이스 연결 URL',
        'spring.datasource.username': '데이터베이스 사용자명',
        'spring.datasource.password': '데이터베이스 비밀번호'
    ]
    
    return descriptions[varName] ?: '설정 값'
}